  <script>
const D = Math.PI / 180;
const R = 1737.4;
const AU = 149597870.7;
const sin = x => Math.sin(x * D);
const cos = x => Math.cos(x * D);
const mod = x => ((x % 360) + 360) % 360;

// Series de Meeus (Astronomical Algorithms): longitud, latitud y distancia de la Luna
const LT = [
    [0, 0, 1, 0, 6288774],
    [2, 0, -1, 0, 1274027],
    [2, 0, 0, 0, 658314],
    [0, 0, 2, 0, 213618],
    [0, 1, 0, 0, -185116],
    [0, 0, 0, 2, -114332],
    [2, 0, -2, 0, 58793],
    [2, -1, -1, 0, 57066],
    [2, 0, 1, 0, 53322],
    [2, -1, 0, 0, 45758],
    [0, 1, -1, 0, -40923],
    [1, 0, 0, 0, -34720],
    [0, 1, 1, 0, -30383],
    [2, 0, 0, -2, 15327],
    [0, 0, 1, 2, -12528],
    [0, 0, 1, -2, 10980],
];
const BT = [
    [0, 0, 0, 1, 5128122],
    [0, 0, 1, 1, 280602],
    [0, 0, 1, -1, 277693],
    [2, 0, 0, -1, 173237],
    [2, 0, -1, 1, 55413],
    [2, 0, -1, -1, 46271],
    [2, 0, 0, 1, 32573],
    [0, 0, 2, 1, 17198],
];
const RT = [
    [0, 0, 1, 0, -20905355],
    [2, 0, -1, 0, -3699111],
    [2, 0, 0, 0, -2955968],
    [0, 0, 2, 0, -569925],
    [0, 1, 0, 0, 48888],
    [0, 0, 0, 2, -3149],
    [2, 0, -2, 0, 246158],
    [2, -1, -1, 0, -152138],
    [2, 0, 1, 0, -170733],
    [2, -1, 0, 0, -204586],
    [0, 1, -1, 0, -129620],
    [1, 0, 0, 0, 108743],
    [0, 1, 1, 0, 104755],
];

const vec = (l, b) => [cos(b) * cos(l), cos(b) * sin(l), sin(b)];

function geo(jd) {
    const T = (jd - 2451545) / 36525;
    const Lp = mod(218.3164477 + 481267.88123421 * T);
    const Dd = mod(297.8501921 + 445267.1114034 * T);
    const M = mod(357.5291092 + 35999.0502909 * T);
    const Mp = mod(134.9633964 + 477198.8675055 * T);
    const F = mod(93.272095 + 483202.0175233 * T);
    const Om = mod(125.0445479 - 1934.1362891 * T);
    const sm = (t, f) => t.reduce((a, r) => a + r[4] * f(r[0] * Dd + r[1] * M + r[2] * Mp + r[3] * F), 0);
    const lam = Lp + sm(LT, sin) / 1e6;
    const bet = sm(BT, sin) / 1e6;
    const dist = 385000.56 + sm(RT, cos) / 1e3;
    const Ms = mod(357.52911 + 35999.05029 * T);
    const C = (1.914602 - .004817 * T) * sin(Ms) + .019993 * sin(2 * Ms) + .000289 * sin(3 * Ms);
    const ls = 280.46646 + 36000.76983 * T + C;
    const ec = .016708634 - .000042037 * T;
    const Rs = 1.000001018 * (1 - ec * ec) / (1 + ec * cos(Ms + C)) * AU;
    const lib = (l, b) => {
        const W = l - Om;
        const I = 1.54242;
        const A = Math.atan2(sin(W) * cos(b) * cos(I) - sin(b) * sin(I), cos(W) * cos(b)) / D;
        let ll = mod(A - F);
        if (ll > 180)
            ll -= 360;
        return [ll, Math.asin(-sin(W) * cos(b) * sin(I) - sin(b) * cos(I)) / D];
    };
    const k = dist / Rs;
    const e = lib(lam, bet);
    const s = lib(ls + 180 + k * 57.2958 * cos(bet) * sin(ls - lam), k * bet);
    return { e: vec(e[0], e[1]), s: vec(s[0], s[1]), d: dist };
}

function look(la, lo, v, d) {
    const n = [cos(la) * cos(lo), cos(la) * sin(lo), sin(la)];
    const E = [-sin(lo), cos(lo), 0];
    const N = [-sin(la) * cos(lo), -sin(la) * sin(lo), cos(la)];
    let w = d ? v.map((x, i) => x * d - R * n[i]) : v;
    const m = Math.hypot(...w);
    w = w.map(x => x / m);
    const dt = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    return [Math.asin(dt(w, n)) / D, mod(Math.atan2(dt(w, E), dt(w, N)) / D)];
}

        const Yp = e => 120 - (e + 4) / (ph + 4) * 120;
        const dot = (az, el, r, col) => `<circle cx="${X(az)}" cy="${Yp(el)}" r="${r * 2.6}" fill="${col}" opacity="${el > h ? .2 : 0}"/><circle cx="${X(az)}" cy="${Yp(el)}" r="${r}" fill="${col}" opacity="${el > h ? 1 : .35}"/>`;
        const pano = `<svg viewBox="0 0 600 120" role="img" aria-label="${t("a2")}"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01030a"/><stop offset="1" stop-color="#101c33"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5262"/><stop offset="1" stop-color="#12161d"/></linearGradient></defs><rect width="600" height="120" fill="url(#sk)"/>${STARS}<rect y="${Yp(h)}" width="600" height="${120 - Yp(h)}" fill="url(#gg)"/><line x1="0" x2="600" y1="${Yp(h)}" y2="${Yp(h)}" stroke="var(--mut)"/>${[["N", 0], ["E", 90], ["S", 180], [lang == "es" ? "O" : "W", 270]].map(a => `<text x="${X(a[1]) + 4}" y="12" font-size="11" fill="var(--mut)">${a[0]}</text>`).join("")}${dot(d.ea[k], d.e[k], 9, "var(--ea)")}${dot(d.sa[k], d.s[k], 4.5, "var(--sun)")}</svg>`;
        document.querySelector("#c" + i + " .out").innerHTML = `<span class="v ${vd[0]}">${t(vd[1])}</span>
${grp('<i class="ic s"></i>' + t("gp1"), [tile(nf(d.s[k]) + "°", t("sunnow"), t("tsun"), stt(d.s, k, h)), tile(pc(sx.p), t("sunpct"), t("tsunpct")), tile(fmt(sx.n), t("night"), t("tnight")), tile(nf(mx) + "°", t("sunmax"), t("tsunmax"))], "s")}
${grp('<i class="ic e"></i>' + t("gp2"), [tile(nf(d.e[k]) + "°", t("earnow"), t("tear"), stt(d.e, k, h)), tile(pc(ex.p), t("earpct"), t("tearpct"))], "e")}
${grp('<i class="ic b"></i>' + t("gp3"), [tile(pc(both), t("both"), t("tboth"))], "b")}
<p class="cap">${t("capsky")} <span class="sw" style="background:var(--sun)"></span>${t("sun")} <span class="sw" style="background:var(--ea)"></span>${t("earth")}</p>${pano}
<h3 class="sec">${t("dm")}</h3><div class="dome" data-dome="${i}"></div><h3 class="sec">${t("chh")}</h3>${leg}${chart}<p class="cap">${t("read")}</p><p class="cap">${t("capv")}</p>`;
        finder(c, i);
        drawDome(i);
    });
}

function hash() { return "l=" + lang + "&d=" + days + "&m=" + mlv + S.map((c, i) => "&" + "AB"[i] + "=" + [c.si, c.lat, c.lon, c.date, c.h].join(",")).join(""); }
function load() {
    try {
        const p = new URLSearchParams(location.hash.slice(1));
        if (p.get("l"))
            lang = p.get("l") == "en" ? "en" : "es";
        if ([15, 30, 90, 365].includes(+p.get("d")))
            days = +p.get("d");
        if ([7, 14, 28].includes(+p.get("m")))
            mlv = +p.get("m");
        ["A", "B"].forEach((n, i) => {
            const v = (p.get(n) || "").split(",");
            if (v.length == 5 && ![v[0], v[1], v[2], v[4]].some(x => isNaN(+x)) && !isNaN(Date.parse(v[3]))) {
                const c = S[i];
                c.si = Math.max(0, Math.min(SITES.length - 1, +v[0]));
                c.lat = Math.max(-90, Math.min(90, +v[1]));
                c.lon = +v[2];
                c.date = v[3];
                c.h = Math.max(0, Math.min(10, +v[4]));
            }
        });
    }
    catch (e) { }
}
function csv() {
    const es = lang == "es";
    const sp = es ? ";" : ",";
    const n = (x, d) => { const v = x.toFixed(d); return es ? v.replace(".", ",") : v; };
    const yn = b => b ? (es ? "Sí" : "Yes") : "No";
    const r = [(es ? ["Escenario", "Sitio", "Latitud (°)", "Longitud este (°)", "Fecha (UTC)", "Hora (UTC)", "Altura del Sol (°)", "Acimut del Sol (°)", "Altura de la Tierra (°)", "Acimut de la Tierra (°)", "Sol visible", "Tierra visible"] : ["Scenario", "Site", "Latitude (°)", "East longitude (°)", "Date (UTC)", "Time (UTC)", "Sun height (°)", "Sun azimuth (°)", "Earth height (°)", "Earth azimuth (°)", "Sun visible", "Earth visible"]).join(sp)];
    S.forEach((c, i) => {
        c.id = i;
        const d = calc(c);
        const nm = SITES[c.si][0][es ? 0 : 1].replace(/[;,]/g, " ");
        d.s.forEach((x, q) => {
            const iso = new Date((d.j0 - 2440587.5) * 864e5 + q * step() * 36e5).toISOString();
            r.push(["AB"[i], nm, n(c.lat, 2), n(c.lon, 2), iso.slice(0, 10), iso.slice(11, 16), n(x, 2), n(d.sa[q], 1), n(d.e[q], 2), n(d.ea[q], 1), yn(x > c.h), yn(d.e[q] > c.h)].join(sp));
        });
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + r.join("\r\n")], { type: "text/csv;charset=utf-8" }));
    a.download = "selene.csv";
    a.click();
}

const V = [{ y: 25, p: 52 }, { y: 25, p: 52 }];
let drag = null;
let scrub = null;
function drawDome(i) {
    const el = document.querySelector(`[data-dome="${i}"]`);
    const c = S[i];
    const d = cache[i];
    if (!el || !d)
        return;
    const v = V[i];
    const h = c.h;
    const m = Math.max(...d.s.map(Math.abs), ...d.e.map(Math.abs));
    const ex = Math.max(1, Math.min(8, 45 / m));
    const cx = 210;
    const cy = 138;
    const Rr = 150;
    const P = (x, y, z) => { const a = x * cos(v.y) - y * sin(v.y); const b = x * sin(v.y) + y * cos(v.y); return [cx + Rr * a, cy - Rr * (b * sin(v.p) + z * cos(v.p))]; };
    const cl = E => Math.max(-85, Math.min(85, E));
    const Q = (az, E) => P(sin(az) * cos(E), cos(az) * cos(E), sin(E));
    const U = (az, e) => Q(az, cl(e * ex));
    const G = (az, e) => P(sin(az) * cos(cl(e * ex)), cos(az) * cos(cl(e * ex)), 0);
    const f = a => a.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
    const ring = e => f(Array.from({ length: 73 }, (_, q) => U(q * 5, e)));
    const mer = [0, 90, 180, 270].map(a => `<polyline fill="none" stroke="#24324d" points="${f(Array.from({ length: 18 }, (_, q) => Q(a, q * 5)))}"/>`).join("");
    const cp = [["N", 0], ["E", 90], ["S", 180], [lang == "es" ? "O" : "W", 270]].map(([n, a]) => { const p = P(sin(a) * 1.14, cos(a) * 1.14, 0); return `<text x="${p[0].toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--mut)">${n}</text>`; }).join("");
    const j0 = d.j0 + k * step() / 24;
    const pt = [];
    for (let o = -12; o <= 60; o++) {
        const g = geo(j0 + o / 24);
        pt.push({ s: look(c.lat, c.lon, g.s, 0), e: look(c.lat, c.lon, g.e, g.d) });
    }
    const path = (key, col) => {
        let a = "";
        let b = "";
        for (let q = 1; q < pt.length; q++) {
            const A = U(pt[q - 1][key][1], pt[q - 1][key][0]);
            const B = U(pt[q][key][1], pt[q][key][0]);
            const s = `M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${B[0].toFixed(1)} ${B[1].toFixed(1)}`;
            if (pt[q][key][0] > h)
                a += s;
            else
                b += s;
        }
        return `<path d="${b}" stroke="${col}" stroke-opacity=".4" stroke-dasharray="3 3" fill="none"/><path d="${a}" stroke="${col}" stroke-width="2.5" fill="none"/>`;
    };
    const body = (key, col, r) => { const e = pt[12][key]; const p = U(e[1], e[0]); const g = G(e[1], e[0]); const on = e[0] > h; return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${g[0].toFixed(1)}" y2="${g[1].toFixed(1)}" stroke="${col}" stroke-opacity=".5" stroke-dasharray="2 3"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r * 2.5}" fill="${col}" opacity="${on ? .22 : 0}"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${col}" opacity="${on ? 1 : .45}"/>`; };
    el.innerHTML = `<svg viewBox="0 0 420 280" role="img" aria-label="${t("dm")}"><defs><radialGradient id="dg"><stop offset="0" stop-color="#3a4254"/><stop offset="1" stop-color="#10141b"/></radialGradient></defs>
<polygon points="${ring(0)}" fill="url(#dg)" stroke="#8f9bb0" stroke-opacity=".6"/>${mer}${h > 0 ? `<polyline fill="none" stroke="var(--sun)" stroke-opacity=".6" stroke-dasharray="4 3" points="${ring(h)}"/>` : ""}${cp}
${path("s", "var(--sun)")}${path("e", "var(--ea)")}${body("s", "var(--sun)", 5)}${body("e", "var(--ea)", 8)}</svg><p class="cap" style="padding:0 10px 8px">${t("dmcap").replace("{x}", nf(ex, 1))}</p>`;
}
function scr() { const s = document.querySelector(`[data-ch="${scrub}"]`); if (!s)
    return; const r = s.getBoundingClientRect(); const fx = (scr.x - r.left) / r.width * 640; const N = NN(); k = Math.max(0, Math.min(N, Math.round((fx - 46) / 584 * N))); $("#t").value = k; render(); }
document.addEventListener("pointerdown", e => {
    const m = e.target.closest("[data-dome]");
    const c = e.target.closest("[data-ch]");
    if (m) {
        drag = { i: +m.dataset.dome, x: e.clientX, y: e.clientY };
        e.preventDefault();
    }
    else if (c) {
        scrub = +c.dataset.ch;
        scr.x = e.clientX;
        scr();
    }
});
document.addEventListener("pointermove", e => { if (drag) {
    const v = V[drag.i];
    v.y = (v.y + (e.clientX - drag.x) * .5) % 360;
    v.p = Math.max(5, Math.min(85, v.p + (e.clientY - drag.y) * .4));
    drag.x = e.clientX;
    drag.y = e.clientY;
    drawDome(drag.i);
}
else if (scrub != null) {
    scr.x = e.clientX;
    scr();
} });
document.addEventListener("pointerup", () => { drag = null; scrub = null; });
document.addEventListener("dblclick", e => { const m = e.target.closest("[data-dome]"); if (m) {
    V[+m.dataset.dome] = { y: 25, p: 52 };
    drawDome(+m.dataset.dome);
} });

const fc = {};
function finder(c, i) {
    const L = mlv;
    const key = [c.lat, c.lon, c.date, c.h, L].join();
    let f = fc[i];
    if (!f || f.key != key) {
        const n = (90 + L) * 4;
        const w = L * 4;
        const j0 = Date.parse(c.date + "T00:00:00Z") / 864e5 + 2440587.5 - 30;
        const ps = [0];
        const pe = [0];
        for (let q = 0; q < n; q++) {
            const g = geo(j0 + q / 4);
            ps.push(ps[q] + (look(c.lat, c.lon, g.s, 0)[0] > c.h));
            pe.push(pe[q] + (look(c.lat, c.lon, g.e, g.d)[0] > c.h));
        }
        const r = [];
        for (let o = 0; o <= 90; o++) {
            const a = 100 * (ps[o * 4 + w] - ps[o * 4]) / w;
            const b = 100 * (pe[o * 4 + w] - pe[o * 4]) / w;
            r.push({ o, a, b, s: (a + b) / 2 });
        }
        f = fc[i] = { key, r, j0 };
    }
    const dt = o => new Date((f.j0 - 2440587.5 + o) * 864e5).toISOString().slice(0, 10);
    const top = [];
    const wd = 600 / 91;
    [...f.r].sort((x, y) => y.s - x.s).forEach(x => { if (top.length < 3 && top.every(y => Math.abs(y.o - x.o) >= 3))
        top.push(x); });
    document.querySelector("#c" + i + " .fin").innerHTML = `<h3>${t("fh")}</h3><p class="cap">${t("fcap").replace("{L}", L)}</p>
<svg viewBox="0 0 600 34" role="img" aria-label="${t("a3")}">${f.r.map(x => `<rect x="${(x.o * wd).toFixed(1)}" y="0" width="${(wd + .5).toFixed(1)}" height="30" fill="hsl(${(x.s * 1.3).toFixed(0)},65%,42%)"/>`).join("")}<line x1="${30 * wd + wd / 2}" x2="${30 * wd + wd / 2}" y1="0" y2="34" stroke="var(--fg)" stroke-width="2"/></svg>
<p class="cap">${t("fbest")}</p><div class="sh">${top.map(x => `<button type="button" data-i="${i}" data-date="${dt(x.o)}">${t("fbtn").replace("{d}", dt(x.o)).replace("{a}", x.a.toFixed(0)).replace("{b}", x.b.toFixed(0))}</button>`).join("")}</div>`;
}
function sync() { const q = $("#t"); q.max = NN(); if (k > NN())
    k = NN(); q.value = k; }

document.addEventListener("input", e => {
    const q = e.target;
    const i = q.dataset.i;
    if (q.id == "lang") {
        lang = q.value;
        ui();
        buildCards();
        render();
        return;
    }
    if (q.id == "days") {
        days = +q.value;
        cache = {};
        k = 0;
        sync();
        render();
        return;
    }
    if (q.id == "ml") {
        mlv = +q.value;
        render();
        return;
    }
    if (q.id == "t") {
        k = +q.value;
        render();
        return;
    }
    if (i == null)
        return;
    const c = S[i];
    const f = q.dataset.f;
    const cd = $("#c" + i);
    if (f == "si") {
        c.si = +q.value;
        c.lat = SITES[c.si][1];
        c.lon = SITES[c.si][2];
        cd.querySelector("[data-f=lat]").value = c.lat;
        cd.querySelector("[data-f=lon]").value = c.lon;
    }
    else if (f == "date") {
        if (!q.value)
            return;
        c.date = q.value;
    }
    else {
        const v = parseFloat(q.value);
        if (isNaN(v))
            return;
        c[f] = f == "lat" ? Math.max(-90, Math.min(90, v)) : v;
        if (f == "h")
            cd.querySelector("output").textContent = c.h + "°";
        else {
            c.si = SITES.length - 1;
            cd.querySelector("[data-f=si]").value = c.si;
        }
    }
    render();
});
document.addEventListener("click", e => {
    const q = e.target;
    const dd = q.dataset;
    if (q.id == "csv") {
        csv();
        return;
    }
    if (q.id == "share") {
        const u = location.href.split("#")[0] + "#" + hash();
        try {
            history.replaceState(null, "", "#" + hash());
        }
        catch (x) { }
        const ok = () => { q.textContent = t("copied"); setTimeout(() => q.textContent = t("share"), 1500); };
        if (navigator.clipboard)
            navigator.clipboard.writeText(u).then(ok, () => prompt(t("share"), u));
        else
            prompt(t("share"), u);
        return;
    }
    if (q.id == "play") {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        else
            timer = setInterval(() => { k = k >= NN() ? 0 : k + 1; $("#t").value = k; render(); }, 70);
        q.textContent = t(timer ? "pause" : "play");
        return;
    }
    if (q.id == "why") {
        [0, 2].forEach((h, i) => {
            const c = S[i];
            const cd = $("#c" + i);
            Object.assign(c, { si: 1, lat: SITES[1][1], lon: SITES[1][2], h, date: "2027-03-01" });
            cd.querySelector("[data-f=si]").value = 1;
            cd.querySelector("[data-f=lat]").value = c.lat;
            cd.querySelector("[data-f=lon]").value = c.lon;
            cd.querySelector("[data-f=date]").value = c.date;
            cd.querySelector("[data-f=h]").value = h;
            cd.querySelector("output").textContent = h + "°";
        });
        days = 30;
        $("#days").value = 30;
        cache = {};
        k = 0;
        whyOn = true;
        $("#whyt").hidden = false;
        sync();
        render();
        return;
    }
    if (dd.i == null)
        return;
    const c = S[dd.i];
    if (dd.sh != null)
        c.date = new Date(Date.parse(c.date + "T00:00:00Z") + dd.sh * 864e5).toISOString().slice(0, 10);
    else if (dd.date)
        c.date = dd.date;
    else
        return;
    $("#c" + dd.i).querySelector("[data-f=date]").value = c.date;
    render();
});

load();
ui();
buildCards();
render();
  </script>
</body>
</html>
